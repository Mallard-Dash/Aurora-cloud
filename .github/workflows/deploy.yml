name: Deploy Aurora (Self-Hosted)

# Körs när du pushar till main
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    # VIKTIGT: Detta säger åt GitHub att använda DIN server, inte molnet
    runs-on: self-hosted

    steps:
    # 1. Hämta koden från GitHub till runner-mappen på din server
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Flytta filerna lokalt på servern (inga nätverksproblem!)
    - name: Deploy Files Locally
      run: |
        echo "🚀 Starting Local Deployment..."
        
        # Flytta Frontend till webb-mappen
        # Vi använder rsync för att det är snabbt och säkert
        echo "📂 Updating Frontend..."
        sudo rsync -av --delete ./frontend/ /var/www/aurora/
        
        # Flytta Backend till app-mappen
        echo "🐍 Updating Backend..."
        # Lägg till --delete för att rensa bort skräpfiler på servern
        rsync -av --delete --exclude='AURORA_CLOUD' --exclude='.venv' --exclude='__pycache__' ./backend/ /home/aurora/aurora/backend/
        
        # Installera nya python-paket om det behövs
        echo "📦 Checking dependencies..."
        source /home/aurora/aurora/.venv/bin/activate
        pip install -r ./backend/requirements.txt
        
        # Starta om tjänsten
        echo "🔄 Restarting Aurora Service..."
        sudo systemctl restart aurora
        
        echo "✅ Deployment Successful! Server is updated."