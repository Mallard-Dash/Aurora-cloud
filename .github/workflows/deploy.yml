name: Deploy Aurora

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # 1. Kopiera filer till servern (till en temporär mapp)
    - name: Copy files to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.username }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        # Kopiera mapparna frontend och backend
        source: "frontend/,backend/"
        target: "/home/aurora/deploy_temp"

    # 2. Logga in och flytta filerna till rätt plats + starta om
    - name: Install & Restart
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.username }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "🚀 Starting deployment logic..."
          
          # Flytta Frontend (Webbfiler)
          # Använder rsync för att bara uppdatera ändrade filer
          # sudo behövs om aurora inte äger /var/www, annars ta bort sudo
          sudo rsync -av --delete /home/aurora/deploy_temp/frontend/ /var/www/aurora/
          
          # Flytta Backend (Applikationskod)
          # Vi raderar INTE .env eller .venv, så --delete används inte här
          rsync -av /home/aurora/deploy_temp/backend/ /home/aurora/aurora/backend/
          
          # Installera dependencies
          echo "📦 Installing dependencies..."
          source /home/aurora/aurora/.venv/bin/activate
          pip install -r /home/aurora/aurora/backend/requirements.txt
          
          # Städa temp-filer
          rm -rf /home/aurora/deploy_temp
          
          # Starta om tjänsten
          echo "🔄 Restarting Service..."
          sudo systemctl restart aurora
          
          echo "✅ Deployment Complete!"