<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora-cloud Portal</title>
    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex">

    <!-- Login Page Container (Default View) -->
    <div id="login-container" class="absolute inset-0 flex items-center justify-center bg-gray-900 z-50 transition-opacity duration-500">
        <div class="w-full max-w-md p-8 space-y-8 bg-gray-800 rounded-2xl shadow-2xl gradient-border">
            <div class="text-center">
                <!-- Cloud Icon SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" class="lucide lucide-cloud mx-auto text-indigo-400 mb-2">
                    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                </svg>
                <h1 class="text-3xl font-extrabold text-white">Aurora-cloud Portal</h1>
                <p class="mt-2 text-sm text-gray-400">Sign in to manage your server artifacts.</p>
            </div>
            <form id="login-form" class="mt-8 space-y-6">
                <div class="space-y-4">
                    <input type="text" id="username-input" placeholder="Username (e.g., root)" required class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-indigo-500 focus:border-indigo-500">
                    <input type="password" id="password-input" placeholder="Password (e.g., ChangeMeNow!)" required class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <p id="login-error" class="text-sm text-red-400 text-center hidden"></p>
                <div>
                    <button type="submit" id="login-button" class="w-full flex justify-center py-3 px-4 rounded-lg shadow-sm text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                        Sign In
                    </button>
                </div>
            </form>
            <div class="text-center text-xs text-gray-500 pt-4 border-t border-gray-700/50">
                <p>Designed for the FastAPI Server Portal.</p>
            </div>
        </div>
    </div>
    
    <!-- Main Application Container (Hidden until authenticated) -->
    <div id="app-container" class="min-h-screen bg-gray-900 font-inter text-white flex w-full hidden">
        
        <!-- Sidebar -->
        <div id="sidebar" class="w-64 bg-gray-800 flex flex-col p-4 shadow-xl border-r border-gray-700/50">
            <div class="flex items-center mb-10 mt-4">
                <!-- Cloud Icon SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="lucide lucide-cloud text-indigo-400 mr-2">
                    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                </svg>
                <span class="text-xl font-extrabold text-white">Aurora-cloud</span>
            </div>
            <nav id="nav-list" class="flex-grow space-y-2">
                <!-- Navigation items injected here -->
            </nav>
            <div class="mt-8 pt-4 border-t border-gray-700">
                <button onclick="handleSignOut()" class="flex items-center w-full px-4 py-3 rounded-xl text-left text-red-400 hover:bg-red-900/50 transition duration-200">
                    <!-- LogOut Icon SVG -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="lucide lucide-log-out mr-3"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                    Sign Out
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
            <header class="mb-8 pb-4 border-b border-gray-700/50">
                <h1 id="page-title" class="text-3xl font-bold capitalize">System Metrics</h1>
                <p id="page-subtitle" class="text-sm text-gray-400 mt-1">View and manage your server status and resources.</p>
            </header>
            
            <div id="main-content">
                <!-- Page content injected here -->
            </div>
        </main>
    </div>

    <!-- Load JavaScript -->
    <script src="script.js"></script>
</body>
</html>
