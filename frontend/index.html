<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Server Portal</title>
    
    <!-- 1. SÄKERHETSKONTROLL -->
    <script>
        try {
            const token = localStorage.getItem('aurora_token');
            if (!token && window.location.protocol !== 'blob:' && window.location.hostname !== 'localhost') {
                window.location.href = '/login.html';
            }
        } catch (e) { console.warn("Auth-check skipped"); }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
            "lucide-react": "https://esm.sh/lucide-react@0.460.0?deps=react@18.2.0"
        }
    }
    </script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Fonts: Orbitron (Cybero-style), Inter, VT323 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&family=VT323&display=swap" rel="stylesheet">

    <style>
        /* Scrollbar Styles */
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(94, 234, 212, 0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(94, 234, 212, 0.4); }

        body { background-color: #020617; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
        
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Typography Classes */
        .font-cybero { font-family: 'Orbitron', sans-serif; letter-spacing: 0.05em; }
        .font-mono-logs { font-family: 'VT323', monospace; }
        
        /* Smooth Scroll */
        .scroll-smooth { scroll-behavior: smooth; }

</head>
<body class="bg-slate-950 text-slate-200 overflow-hidden selection:bg-teal-500/30 selection:text-teal-100">

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        // IMPORTERAR ALLA IKONER SOM BEHÖVS (INKLUSIVE NYA FILM, TV, SMARTPHONE)
        import { 
          Terminal, Activity, Shield, Cpu, Wifi, Database, Lock, Menu, X, Radio, 
          Zap, Globe, Cloud, Sun, CloudRain, Wind, MessageSquare, Server, 
          Table, User, Save, Trash2, Edit2, Play, Square, HardDrive, FileText, Image as ImageIcon,
          Calendar, ChevronLeft, ChevronRight, Plus, Check, Thermometer, Clock, ArrowUp, ArrowDown,
          Folder, Download, Upload, CornerLeftUp, Music, Video, File, PenTool, Hash, TrendingUp, LogOut,
          MemoryStick, Disc, ShieldCheck, Brain, Moon, Bell, MapPin, CheckCircle, RotateCcw, Users, Settings,
          Home, Hammer, Cog, Sparkles, Layers, PlugZap, DollarSign, Camera, HeartPulse, Search, Filter, Box, 
          LockKeyhole, CloudLightning, CloudSnow, AlertTriangle, Smartphone, Film, Tv, Code
        } from 'lucide-react';

        // --- 1. HELPERS & UTILS ---

        const authFetch = async (url, options = {}) => {
            const token = localStorage.getItem('aurora_token') || "preview_token";
            const headers = {
                ...options.headers,
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
            if (options.body instanceof FormData) {
                delete headers['Content-Type'];
            }

            try {
                const res = await fetch(url, { ...options, headers });
                if (res.status === 401 && window.location.protocol !== 'blob:') {
                    localStorage.removeItem('aurora_token');
                    window.location.href = '/login.html';
                }
                return res;
            } catch (e) {
                console.warn(`API fallback för ${url}`, e);
                return null; 
            }
        };

        const formatBytes = (bytes, decimals = 2) => {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        };

        const generateForecast = () => {
          const hours = [];
          for (let i = 0; i < 8; i++) {
            const time = new Date();
            time.setHours(time.getHours() + i * 3);
            hours.push({
              time: time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              temp: Math.floor(Math.random() * (20 - 10) + 10),
              condition: ['sunny', 'cloudy', 'rainy', 'partly'][Math.floor(Math.random() * 4)]
            });
          }
          return hours;
        };

        const getGreeting = () => {
          const hour = new Date().getHours();
          if (hour >= 4 && hour < 9) return "Good morning";
          if (hour >= 9 && hour < 12) return "Good day";
          if (hour >= 12 && hour < 16) return "Good afternoon";
          if (hour >= 16 && hour < 22) return "Good evening";
          return "Good night";
        };

        // --- 2. THEMES ---

        const THEMES = {
          cyberpunk: {
            id: 'cyberpunk',
            label: 'NEBULA',
            bg: 'bg-slate-950',
            panel: 'bg-slate-900/40',
            sidebar: 'bg-slate-950/80',
            border: 'border-white/5',
            text: 'text-slate-200',
            textDim: 'text-slate-400',
            accent: 'text-teal-400',
            accentBg: 'bg-teal-500/10',
            accentBorder: 'border-teal-500/20',
            inputBg: 'bg-slate-900/50',
            particle: 'rgba(45, 212, 191, 0.6)',
            canvas: '#020617',
            scanline: false
          },
          light: {
            id: 'light',
            label: 'DAYLIGHT',
            bg: 'bg-[#f0f4f8]', 
            panel: 'bg-white/80 shadow-sm', 
            sidebar: 'bg-white/90 border-r border-slate-200',
            border: 'border-slate-200',
            text: 'text-slate-700',
            textDim: 'text-slate-500',
            accent: 'text-indigo-600',
            accentBg: 'bg-indigo-50',
            accentBorder: 'border-indigo-200',
            inputBg: 'bg-white border border-slate-200',
            particle: '#818cf8', 
            canvas: '#f0f4f8', 
            scanline: false
          }
        };

        // --- 3. UI COMPONENTS ---

        const Card = ({ title, icon: Icon, children, className = "", theme }) => (
          <div className={`${theme.panel} backdrop-blur-xl border ${theme.border} rounded-2xl p-6 flex flex-col shadow-lg ${className} transition-all duration-500 animate-fade-in hover:border-opacity-50`}>
            {title && (
              <div className={`flex items-center gap-3 mb-5 pb-3 border-b ${theme.border}`}>
                {Icon && <div className={`p-1.5 rounded-lg ${theme.accentBg} ${theme.accent}`}><Icon size={18} /></div>}
                <h3 className={`text-sm font-semibold tracking-wide ${theme.text}`}>{title}</h3>
              </div>
            )}
            {children}
          </div>
        );

        const CyberCard = ({ children, title, className = "", actionButton = null }) => (
          <div className={`relative bg-gradient-to-b from-slate-900/60 to-slate-900/40 backdrop-blur-xl border border-white/5 rounded-2xl overflow-hidden group ${className} shadow-lg transition-all hover:shadow-teal-900/20`}>
            <div className="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-teal-500/30 to-transparent opacity-50" />
            {(title || actionButton) && (
              <div className="flex items-center justify-between px-6 py-4 border-b border-white/5 bg-white/[0.02]">
                {title && <h3 className="text-xs font-bold tracking-[0.15em] text-teal-400/90 uppercase flex items-center gap-2">
                    <span className="w-1 h-1 rounded-full bg-teal-400 shadow-[0_0_8px_rgba(45,212,191,0.8)]"></span>
                    {title}
                </h3>}
                {actionButton}
              </div>
            )}
            <div className="p-6 relative z-10 h-full">{children}</div>
          </div>
        );

        const GlowCard = ({ children, title, icon: Icon, className = "", theme }) => {
            return (
              <div className={`relative bg-slate-900/40 backdrop-blur-md border border-white/5 rounded-2xl overflow-hidden group hover:bg-slate-800/40 transition-all duration-500 ${className}`}>
                <div className="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-700 bg-gradient-to-tr from-teal-500/5 via-transparent to-indigo-500/5 pointer-events-none" />
                <div className="flex items-center gap-2 px-5 py-4 border-b border-white/5 z-20 relative">
                  {Icon && <Icon size={16} className="text-teal-400/80" />}
                  <h3 className="text-[11px] font-bold tracking-widest text-slate-400 uppercase group-hover:text-teal-300 transition-colors">{title}</h3>
                </div>
                <div className="p-6 relative z-10 flex flex-col items-center justify-center min-h-[130px] w-full">
                    {children}
                </div>
              </div>
            );
        };

        const MinecraftCard = ({ children, title, className = "", icon: Icon, statusColor }) => (
          <div className={`relative bg-slate-900/50 backdrop-blur-xl border border-white/5 rounded-xl overflow-hidden flex flex-col ${className}`}>
            <div className="flex items-center justify-between px-5 py-3 border-b border-white/5 bg-white/[0.02]">
              <div className="flex items-center gap-2">
                {Icon && <Icon size={14} className={statusColor ? statusColor.replace('border-', 'text-') : 'text-teal-400'} />}
                <h3 className={`text-xs font-bold tracking-wider uppercase ${statusColor ? statusColor.replace('border-', 'text-') : 'text-slate-300'}`}>{title}</h3>
              </div>
            </div>
            <div className="p-5 relative z-10 flex-1 overflow-hidden">{children}</div>
          </div>
        );

        // --- 4. VISUALS ---

        const PlasmaClock = () => {
            const [time, setTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const secDeg = (time.getSeconds() / 60) * 360;
            const minDeg = (time.getMinutes() / 60) * 360 + (time.getSeconds() / 60) * 6;
            const hourDeg = (time.getHours() / 12) * 360 + (time.getMinutes() / 60) * 30;

            return (
                <div className="relative w-32 h-32 md:w-40 md:h-40 flex items-center justify-center">
                    <div className="absolute inset-0 rounded-full border border-orange-500/30 shadow-[0_0_30px_rgba(249,115,22,0.4)] animate-pulse"></div>
                    <div className="w-28 h-28 md:w-36 md:h-36 rounded-full bg-black/60 border border-orange-500/20 relative shadow-inner flex items-center justify-center backdrop-blur-sm">
                        <div className="w-2 h-2 bg-orange-400 rounded-full z-20 shadow-[0_0_10px_rgba(249,115,22,1)]"></div>
                        <div className="absolute w-[3px] h-[35px] md:h-[45px] bg-orange-600/80 origin-bottom bottom-1/2 left-[calc(50%-1.5px)] rounded-full z-10 transition-transform duration-1000 ease-linear shadow-[0_0_5px_rgba(234,88,12,0.5)]" style={{ transform: `rotate(${hourDeg}deg)` }}></div>
                        <div className="absolute w-[2px] h-[45px] md:h-[55px] bg-orange-500/90 origin-bottom bottom-1/2 left-[calc(50%-1px)] rounded-full z-10 transition-transform duration-1000 ease-linear shadow-[0_0_5px_rgba(249,115,22,0.5)]" style={{ transform: `rotate(${minDeg}deg)` }}></div>
                        <div className="absolute w-[1px] h-[50px] md:h-[60px] bg-orange-300 origin-bottom bottom-1/2 left-[calc(50%-0.5px)] z-10 shadow-[0_0_8px_rgba(253,186,116,0.9)] transition-transform duration-200 ease-out" style={{ transform: `rotate(${secDeg}deg)` }}></div>
                    </div>
                </div>
            );
        };

        const CircularGauge = ({ value, max = 100, label, unit, color = "stroke-teal-500" }) => {
          const radius = 36;
          const circumference = 2 * Math.PI * radius;
          const strokeDashoffset = circumference - (value / max) * circumference;
          return (
            <div className="flex flex-col items-center justify-center relative w-full h-full py-2">
              <div className="relative group">
                <svg className="transform -rotate-90 w-28 h-28 overflow-visible">
                    <circle className="text-slate-800/50" strokeWidth="6" stroke="currentColor" fill="transparent" r={radius} cx="56" cy="56" />
                    <circle className={`${color} transition-all duration-1000 ease-out opacity-90`} strokeWidth="6" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} strokeLinecap="round" stroke="currentColor" fill="transparent" r={radius} cx="56" cy="56" style={{ filter: 'drop-shadow(0 0 6px currentColor)' }} />
                </svg>
                <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                    <span className="text-2xl font-light text-white">{Math.round(value)}</span>
                    <span className="text-[10px] text-slate-500 font-medium">{unit}</span>
                </div>
              </div>
              <span className="mt-2 text-[10px] font-medium text-slate-400 tracking-widest text-center uppercase w-full truncate px-1">{label}</span>
            </div>
          );
        };

        const Sparkline = ({ data, color = "#2dd4bf", height = 60 }) => {
          if (!data || data.length === 0) return null;
          const max = Math.max(Math.max(...data), 1); 
          const width = 100; 
          const points = data.map((val, i) => {
            const x = (i / (data.length - 1)) * width;
            const y = height - ((val / max) * height); 
            return `${x},${y}`;
          }).join(' ');
          return (
            <div className="w-full h-full overflow-hidden relative rounded-md">
              <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="w-full h-full overflow-visible">
                <defs>
                  <linearGradient id={`gradient-${color}`} x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stopColor={color} stopOpacity="0.2" />
                    <stop offset="100%" stopColor={color} stopOpacity="0" />
                  </linearGradient>
                </defs>
                <path d={`M0,${height} ${points} L${width},${height}`} fill={`url(#gradient-${color})`} stroke="none" />
                <polyline fill="none" stroke={color} strokeWidth="1.5" vectorEffect="non-scaling-stroke" points={points} strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </div>
          );
        };

        const ParticleBackground = ({ theme }) => {
          const canvasRef = useRef(null);
          useEffect(() => {
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            let width = window.innerWidth;
            let height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            const nodeCount = Math.min(80, (width * height) / 15000);
            const connectionDistance = 180;
            const nodes = [];

            class Node {
                constructor() {
                    this.x = Math.random() * width; this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3;
                    this.radius = Math.random() * 1.5 + 0.5; this.phase = Math.random() * Math.PI * 2;
                }
                update() {
                    this.x += this.vx; this.y += this.vy; this.phase += 0.01;
                    if (this.x < 0) this.x = width; if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height; if (this.y > height) this.y = 0;
                }
                draw(ctx, color) {
                    const pulse = 0.5 + 0.5 * Math.sin(this.phase);
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius * (1 + pulse * 0.5), 0, Math.PI * 2);
                    ctx.fillStyle = color; ctx.globalAlpha = 0.3 + pulse * 0.5; ctx.fill();
                }
            }

            for (let i = 0; i < nodeCount; i++) nodes.push(new Node());

            let animationFrameId;
            const render = () => {
                ctx.clearRect(0, 0, width, height);
                const isDark = theme.id !== 'light';
                const particleColor = isDark ? '20, 184, 166' : '99, 102, 241';
                
                nodes.forEach(node => { node.update(); node.draw(ctx, `rgb(${particleColor})`); });
                ctx.lineWidth = 0.5;
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const dx = nodes[i].x - nodes[j].x; const dy = nodes[i].y - nodes[j].y; const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < connectionDistance) {
                            const opacity = (1 - distance / connectionDistance) * 0.2;
                            ctx.beginPath(); ctx.strokeStyle = `rgba(${particleColor}, ${opacity})`;
                            ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke();
                        }
                    }
                }
                animationFrameId = requestAnimationFrame(render);
            };
            render();
            const handleResize = () => { width = window.innerWidth; height = window.innerHeight; canvas.width = width * dpr; canvas.height = height * dpr; ctx.scale(dpr, dpr); canvas.style.width = `${width}px`; canvas.style.height = `${height}px`; };
            window.addEventListener('resize', handleResize);
            return () => { cancelAnimationFrame(animationFrameId); window.removeEventListener('resize', handleResize); };
          }, [theme]);
          return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full pointer-events-none z-0 transition-opacity duration-1000" style={{ backgroundColor: theme.canvas }} />;
        };

        const WeatherVisuals = ({ condition, className = "" }) => {
            const is = (str) => condition.toLowerCase().includes(str);
            return (
                <div className={`relative w-full h-full flex items-center justify-center pointer-events-none ${className}`}>
                  {is('sunny') || is('clear') ? (
                      <div className="relative">
                          <Sun className="text-amber-400 animate-[spin_12s_linear_infinite]" size={80} strokeWidth={1.5} />
                          <div className="absolute inset-0 bg-amber-400/30 blur-2xl rounded-full animate-pulse"></div>
                      </div>
                  ) : is('rain') || is('drizzle') ? (
                     <div className="relative">
                         <CloudRain className="text-blue-400" size={80} strokeWidth={1.5} />
                         <div className="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-2">
                             <div className="w-1 h-4 bg-blue-400/50 rounded-full animate-[bounce_1s_infinite]"></div>
                             <div className="w-1 h-4 bg-blue-400/50 rounded-full animate-[bounce_1.2s_infinite] delay-100"></div>
                         </div>
                     </div>
                  ) : is('snow') ? (
                     <div className="relative">
                         <CloudSnow className="text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]" size={80} strokeWidth={1.5} />
                         <div className="absolute top-0 right-0 text-white animate-pulse text-4xl">*</div>
                     </div>
                  ) : is('thunder') || is('lightning') ? (
                     <div className="relative">
                         <CloudLightning className="text-purple-400" size={80} strokeWidth={1.5} />
                         <Zap className="absolute bottom-0 right-2 text-yellow-400 fill-yellow-400 animate-[pulse_0.2s_infinite]" size={32} />
                     </div>
                  ) : (
                     <div className="relative">
                         <Cloud className="text-slate-400 animate-pulse" size={80} strokeWidth={1.5} />
                         <Cloud className="absolute top-2 -right-4 text-slate-500/50" size={40} strokeWidth={1.5} />
                     </div>
                  )}
                </div>
            );
        };

        const TerminalLine = ({ text }) => {
          let colorClass = "text-slate-400";
          if (text.includes("INFO")) colorClass = "text-teal-300";
          if (text.includes("WARN")) colorClass = "text-amber-300";
          if (text.includes("ERROR")) colorClass = "text-rose-400";
          if (text.includes("joined")) colorClass = "text-emerald-400";
          const timestamp = new Date().toLocaleTimeString('sv-SE', { hour12: false });
          return (
            <div className="font-mono-logs text-sm py-0.5 hover:bg-white/5 px-2 rounded transition-colors break-all border-l-2 border-transparent hover:border-white/20">
              <span className="text-slate-600 mr-3 opacity-60">[{timestamp}]</span>
              <span className={colorClass}>{text}</span>
            </div>
          );
        };

        const AddAppointmentModal = ({ isOpen, onClose, onSave, selectedDate }) => {
          const [desc, setDesc] = useState("");
          const [time, setTime] = useState("12:00");
          const [reminder, setReminder] = useState(false);
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md animate-fade-in">
              <div className="w-full max-w-md bg-slate-900/90 border border-white/10 p-8 rounded-2xl shadow-2xl shadow-black/50">
                <h3 className="text-white font-semibold text-lg mb-6 flex items-center gap-2"><Plus size={20} className="text-teal-400" /> New Event</h3>
                <div className="space-y-5">
                  <div><label className="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wider">Date</label><div className="text-slate-200 font-mono bg-white/5 p-2 rounded">{selectedDate?.toDateString()}</div></div>
                  <div><label className="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wider">Description</label><input type="text" value={desc} onChange={(e) => setDesc(e.target.value)} className="w-full bg-black/20 border border-white/10 rounded-lg p-3 text-white focus:border-teal-500/50 outline-none transition-all" placeholder="Meeting details..." autoFocus /></div>
                  <div><label className="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wider">Time</label><input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="w-full bg-black/20 border border-white/10 rounded-lg p-3 text-white focus:border-teal-500/50 outline-none transition-all" /></div>
                  <div className="pt-2"><button onClick={() => setReminder(!reminder)} className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs font-bold transition-all w-full justify-center ${reminder ? 'bg-teal-500/20 text-teal-300 border border-teal-500/30' : 'bg-white/5 text-slate-400 border border-transparent hover:bg-white/10'}`}><Bell size={14} /> {reminder ? "REMINDER ON" : "ADD REMINDER"}</button></div>
                </div>
                <div className="flex justify-end gap-3 mt-8 pt-4 border-t border-white/5"><button onClick={onClose} className="px-5 py-2 rounded-lg hover:bg-white/5 text-slate-400 text-sm font-medium transition-colors">Cancel</button><button onClick={() => { onSave({ desc, time, reminder }); setDesc(""); onClose(); }} className="px-6 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-white text-sm font-bold shadow-lg shadow-teal-900/30 transition-all transform hover:scale-105">Confirm</button></div>
              </div>
            </div>
          );
        };

        // --- 5. VIEWS ---
        
        const CpuCoreVisuals = ({ cores }) => {
            if (!cores || cores.length === 0) return <div className="text-slate-500">Initializing Neural Core...</div>;
            const centerX = 150; const centerY = 150; const radius = 100; const angleStep = (2 * Math.PI) / cores.length;
            return (
                <div className="relative w-full h-[320px] flex items-center justify-center">
                    <svg width="300" height="300" viewBox="0 0 300 300" className="overflow-visible">
                        <g transform={`translate(${centerX - 24}, ${centerY - 24})`}>

        const TelemetryView = ({ theme }) => {
          const [cpuLoad, setCpuLoad] = useState(0); const [cpuTemp, setCpuTemp] = useState(0); const [ramUsed, setRamUsed] = useState(0); const [ramTotal, setRamTotal] = useState(0); const [diskUsed, setDiskUsed] = useState(0); const [diskTotal, setDiskTotal] = useState(0); const [cpuHistory, setCpuHistory] = useState(Array(30).fill(0)); const [netDownHistory, setNetDownHistory] = useState(Array(30).fill(0)); const [netUpHistory, setNetUpHistory] = useState(Array(30).fill(0)); const [netDownSpeed, setNetDownSpeed] = useState(0); const [netUpSpeed, setNetUpSpeed] = useState(0); const lastNetStats = useRef({ recv: 0, sent: 0, time: Date.now() }); const [cpuCores, setCpuCores] = useState([]); const [procCount, setProcCount] = useState(0); const [diskReadSpeed, setDiskReadSpeed] = useState(0); const [diskWriteSpeed, setDiskWriteSpeed] = useState(0); const [diskIOHistory, setDiskIOHistory] = useState(Array(30).fill(0)); const lastDiskStats = useRef({ read: 0, write: 0, time: Date.now() });

          const fetchData = async () => {
            const res = await authFetch('/api/system/stats');
            if (!res || !res.ok) return;
            try {
                const stats = await res.json();
                setCpuLoad(stats.cpu_pct); setCpuTemp(stats.temp || 0); setRamUsed(stats.ram_used / (1024**3)); setRamTotal(stats.ram_total / (1024**3)); setDiskUsed(stats.disk_used / (1024**3)); setDiskTotal(stats.disk_total / (1024**3)); setCpuHistory(prev => [...prev.slice(1), stats.cpu_pct]); setProcCount(stats.process_count || 0); setCpuCores(stats.cpu_cores || []);
                const now = Date.now(); const timeDiff = (now - lastNetStats.current.time) / 1000;
                if (timeDiff > 0 && lastNetStats.current.recv > 0) {
                    const downSpeed = (stats.net_recv - lastNetStats.current.recv) * 8 / timeDiff; const upSpeed = (stats.net_sent - lastNetStats.current.sent) * 8 / timeDiff;
                    setNetDownSpeed(downSpeed); setNetUpSpeed(upSpeed); setNetDownHistory(prev => [...prev.slice(1), downSpeed / (1024 * 1024)]); setNetUpHistory(prev => [...prev.slice(1), upSpeed / (1024 * 1024)]);
                    const rSpeed = Math.max(0, (stats.disk_io_read - lastDiskStats.current.read) / (1024*1024) / timeDiff); const wSpeed = Math.max(0, (stats.disk_io_write - lastDiskStats.current.write) / (1024*1024) / timeDiff);
                    setDiskReadSpeed(rSpeed); setDiskWriteSpeed(wSpeed); setDiskIOHistory(prev => [...prev.slice(1), rSpeed + wSpeed]);
                }
                lastNetStats.current = { recv: stats.net_recv, sent: stats.net_sent, time: now }; lastDiskStats.current = { read: stats.disk_io_read, write: stats.disk_io_write, time: now };
            } catch(e) {}

        const StorageView = ({ theme }) => {

            }, []);

            const handleSaveLog = () => { localStorage.setItem('captainsLog', logEntry); alert("Entry Saved."); };
            const handleAddAppointment = ({ desc, time, reminder }) => { const key = selectedDate.toDateString(); const newAppt = { id: Date.now(), title: desc, time, reminder }; setAppointments(prev => ({ ...prev, [key]: [...(prev[key] || []), newAppt].sort((a,b) => a.time.localeCompare(b.time)) })); };
            const handleDeleteAppointment = (apptId) => { const key = selectedDate.toDateString(); setAppointments(prev => ({ ...prev, [key]: prev[key].filter(a => a.id !== apptId) })); };
            const daysInMonth = (date) => new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            const getStartDay = (date) => { let day = new Date(date.getFullYear(), date.getMonth(), 1).getDay(); return day === 0 ? 6 : day - 1; };
            const renderCalendarDays = () => { const days = []; const totalDays = daysInMonth(currentDate); const startDay = getStartDay(currentDate); for (let i = 0; i < startDay; i++) days.push(<div key={`empty-${i}`} className="h-9 w-9" />); for (let d = 1; d <= totalDays; d++) { const date = new Date(currentDate.getFullYear(), currentDate.getMonth(), d); const isSelected = date.toDateString() === selectedDate.toDateString(); const isToday = date.toDateString() === new Date().toDateString(); const hasEvents = appointments[date.toDateString()]?.length > 0; days.push(<button key={d} onClick={() => setSelectedDate(date)} className={`relative h-9 w-9 rounded-full flex items-center justify-center text-sm transition-all ${isSelected ? 'bg-teal-500 text-white font-bold shadow-lg shadow-teal-500/30' : 'hover:bg-white/10 text-slate-300'} ${isToday && !isSelected ? 'border border-teal-500/50 text-teal-400' : ''}`}>{d} {hasEvents && !isSelected && (<div className="absolute bottom-1 w-1 h-1 bg-teal-400 rounded-full" />)}</button>); } return days; };

            return (
                <div className="animate-fade-in space-y-8">
                    <div className="relative p-8 rounded-3xl bg-gradient-to-r from-slate-900/80 to-slate-900/40 backdrop-blur-xl border border-white/5 overflow-hidden"><div className="absolute right-0 top-0 w-64 h-64 bg-teal-500/10 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/2 pointer-events-none"></div><div className="relative z-10"><h1 className="text-5xl md:text-6xl font-cybero tracking-tight text-white mb-2 italic">{greeting}, <span className="text-transparent bg-clip-text bg-gradient-to-r from-teal-200 to-teal-500 not-italic">{username}</span></h1><div className="flex items-center gap-3 text-slate-400 text-sm font-medium mt-4"><span className="flex items-center gap-1.5"><div className="w-2 h-2 bg-emerald-400 rounded-full shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div> All Systems Nominal</span><span className="opacity-30">|</span><span>{new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</span></div></div></div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <CyberCard className="col-span-1 min-h-[300px]"><div className="flex flex-col justify-between h-full"><div className="flex justify-between items-start"><div><div className="text-5xl font-light text-white">{weather.temp}°</div><div className="text-teal-400 text-sm font-bold uppercase tracking-wider mt-1">{weather.condition}</div><div className="text-slate-500 text-xs mt-1 flex items-center gap-1"><MapPin size={10} /> Stockholm</div></div><div className="w-24 h-24"><WeatherVisuals condition={weather.condition} /></div></div><div className="mt-6"><div className="text-[10px] font-bold text-slate-500 mb-3 uppercase tracking-widest">Forecast</div><div className="flex justify-between overflow-x-auto pb-2 gap-2 scrollbar-none">{forecast.slice(0, 5).map((item, idx) => (<div key={idx} className="flex flex-col items-center space-y-2 min-w-[50px]"><span className="text-[10px] text-slate-500">{item.time}</span><div className="text-slate-300">{item.condition === 'sunny' ? <Sun size={16}/> : item.condition === 'rainy' ? <CloudRain size={16}/> : <Cloud size={16}/>}</div><span className="text-xs font-bold text-white">{item.temp}°</span></div>))}</div></div></div></CyberCard>
                        <CyberCard title="Agenda" className="col-span-1 lg:col-span-2" actionButton={<button onClick={() => setIsModalOpen(true)} className="p-1.5 rounded-lg bg-teal-500/10 text-teal-400 hover:bg-teal-500/20 transition-colors"><Plus size={16} /></button>}><div className="grid grid-cols-1 md:grid-cols-2 gap-8 h-full"><div><div className="flex justify-between items-center mb-4 px-1"><button onClick={() => { const d = new Date(currentDate); d.setMonth(d.getMonth()-1); setCurrentDate(d); }} className="text-slate-500 hover:text-white"><ChevronLeft size={18} /></button><span className="text-sm font-bold text-white uppercase tracking-wider">{currentDate.toLocaleString('default', { month: 'long', year: 'numeric' })}</span><button onClick={() => { const d = new Date(currentDate); d.setMonth(d.getMonth()+1); setCurrentDate(d); }} className="text-slate-500 hover:text-white"><ChevronRight size={18} /></button></div><div className="grid grid-cols-7 gap-1 text-center mb-2">{['M','T','W','T','F','S','S'].map(d => <span key={d} className="text-[10px] font-bold text-slate-600">{d}</span>)}</div><div className="grid grid-cols-7 gap-1 place-items-center">{renderCalendarDays()}</div></div><div className="border-l border-white/5 pl-6 flex flex-col h-full"><h4 className="text-xs font-bold text-teal-500 mb-4 uppercase tracking-widest">{selectedDate.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric' })}</h4><div className="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">{appointments[selectedDate.toDateString()]?.length > 0 ? (appointments[selectedDate.toDateString()].map((appt) => (<div key={appt.id} className="bg-white/[0.03] hover:bg-white/[0.06] border-l-2 border-teal-500 p-3 rounded-r-lg transition-colors group flex justify-between"><div><div className="text-xs font-bold text-white mb-0.5">{appt.title}</div><div className="text-[10px] text-slate-400 font-mono">{appt.time}</div></div><button onClick={() => handleDeleteAppointment(appt.id)} className="opacity-0 group-hover:opacity-100 text-slate-600 hover:text-rose-400 transition-all"><Trash2 size={14} /></button></div>))) : (<div className="text-slate-600 italic text-xs mt-10 text-center">No events scheduled.</div>)}</div></div></div></CyberCard>
                    </div>

                     <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <CyberCard className="col-span-1 flex items-center justify-center min-h-[200px]"><div className="flex flex-col items-center gap-4"><PlasmaClock /><div className="text-xs font-mono text-orange-400/80 tracking-[0.2em]">SYSTEM TIME</div></div></CyberCard>
                        <CyberCard title="Captain's Log" className="col-span-1 md:col-span-3 min-h-[200px]" actionButton={<button onClick={handleSaveLog} className="flex items-center gap-2 text-xs font-bold text-teal-400 hover:text-teal-300"><Save size={14} /> SAVE</button>}><textarea value={logEntry} onChange={(e) => setLogEntry(e.target.value)} placeholder="Write your observations..." className="w-full h-full bg-transparent border-none outline-none resize-none text-sm text-slate-300 placeholder:text-slate-600 leading-relaxed min-h-[120px]" spellCheck="false" /></CyberCard>
                     </div>
                    <AddAppointmentModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} selectedDate={selectedDate} onSave={handleAddAppointment} />
                </div>
            );
        };

        // --- MAIN APP ---
        function AuroraOS() {
          const [activeTab, setActiveTab] = useState('neural');
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
          const [currentTime, setCurrentTime] = useState(new Date());
          const [theme, setTheme] = useState(THEMES.cyberpunk); 
          const [username, setUsername] = useState("Commander"); 
          const [serverUptime, setServerUptime] = useState({ d: 0, h: 0, m: 0 });
          const [avatar, setAvatar] = useState(localStorage.getItem('user_avatar') || '');

          useEffect(() => { 
              const timer = setInterval(() => setCurrentTime(new Date()), 1000); 
              const getUser = async () => { const res = await authFetch('/api/user/me'); if (res && res.ok) { const data = await res.json(); setUsername(data.username); } };
              const getHeaderUptime = async () => { const res = await authFetch('/api/system/stats'); if (res && res.ok) { const s = await res.json(); const days = Math.floor(s.uptime / (3600 * 24)); const hours = Math.floor((s.uptime % (3600 * 24)) / 3600); const mins = Math.floor((s.uptime % 3600) / 60); setServerUptime({ d: days, h: hours, m: mins }); } };
              getUser(); getHeaderUptime(); const uptimeInterval = setInterval(getHeaderUptime, 10000); 
              return () => { clearInterval(timer); clearInterval(uptimeInterval); }
          }, []);

          const handleLogout = () => { localStorage.removeItem('aurora_token'); window.location.href = '/login.html'; };

          const navItems = [
            { id: 'neural', icon: Home, label: 'Home' },
            { id: 'telemetry', icon: Activity, label: 'Aurora-Pulstar' },
            { id: 'health', icon: HeartPulse, label: 'Aurora-Health' },
            { id: 'docker', icon: Box, label: 'Docker Manager' },
            { id: 'minecraft', icon: Hammer, label: 'Minecraft' },
            { id: 'streaming', icon: Film, label: 'Cinema' },
            { id: 'borealis', icon: Sparkles, label: 'Borealis AI' },
            { id: 'storage', icon: Database, label: 'Aurora-Nova' },
            { id: 'settings', icon: Cog, label: 'Settings' }
          ];

          return (
            <div className={`flex h-screen w-full ${theme.bg} transition-colors duration-700 font-sans overflow-hidden relative`}>
              <ParticleBackground theme={theme} />
              
              <aside className={`fixed md:relative top-0 left-0 h-full w-64 ${theme.sidebar} backdrop-blur-2xl transition-transform duration-300 ease-out z-40 flex flex-col ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'} pt-16 md:pt-0`}>
                <div className="p-8 mb-2 hidden md:block"><div className={`text-xl font-bold tracking-tight flex items-center gap-3 ${theme.text}`}><div className="w-8 h-8 rounded-lg bg-gradient-to-br from-teal-400 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-teal-500/20"><Zap size={18} fill="currentColor"/></div>AURORA</div><div className={`text-xs ${theme.textDim} mt-2 font-medium tracking-wide pl-11`}>OS v3.2.0</div></div>
                <nav className="flex-1 px-4 space-y-1 overflow-y-auto py-4">{navItems.map(item => (<button key={item.id} onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all duration-300 group relative overflow-hidden ${activeTab === item.id ? `${theme.accentBg} ${theme.accent} font-bold shadow-md` : `${theme.textDim} hover:bg-slate-500/10 hover:${theme.text}`}`}><item.icon size={20} className={activeTab === item.id ? 'animate-pulse' : ''} strokeWidth={activeTab === item.id ? 2.5 : 2} /><span className="text-sm tracking-wide">{item.label}</span>{activeTab === item.id && <div className={`absolute left-0 top-1/2 -translate-y-1/2 h-8 w-1 rounded-r-full bg-current`}></div>}</button>))}</nav>
                <div className={`p-6 mt-auto`}><button onClick={handleLogout} className={`w-full p-3.5 rounded-xl ${theme.id === 'light' ? 'bg-slate-100 border border-slate-200' : 'bg-white/5 border border-white/5'} flex items-center justify-center gap-2 hover:bg-rose-500/10 hover:border-rose-500/20 hover:text-rose-400 transition-all group`}><LogOut size={18} className={`${theme.textDim} group-hover:text-rose-400`}/><span className={`text-xs font-bold ${theme.textDim} group-hover:text-rose-400`}>LOG OUT</span></button></div>
              </aside>

              <div className="md:hidden fixed top-4 left-4 z-50"><button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 rounded-lg bg-slate-900/80 backdrop-blur border border-white/10 text-white">{isMobileMenuOpen ? <X size={24} /> : <Menu size={24} />}</button></div>

              <main className="flex-1 overflow-y-auto p-4 md:p-10 relative scrollbar-thin scrollbar-thumb-slate-700/20 z-10">
                <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
                   <div className="flex flex-col"><h2 className={`text-2xl font-bold tracking-tight ${theme.text}`}>{navItems.find(n => n.id === activeTab)?.label}</h2></div>
                   <div className={`hidden md:flex items-center gap-6 text-xs font-medium ${theme.textDim} ${theme.panel} px-6 py-2.5 rounded-full border ${theme.border} shadow-sm`}><div className="flex items-center gap-2 text-emerald-400 font-bold shadow-emerald-400/20 drop-shadow-sm"><Activity size={14} /> UPTIME: {serverUptime.d}d {serverUptime.h}h {serverUptime.m}m</div><div className={`h-4 w-px ${theme.id === 'light' ? 'bg-slate-300' : 'bg-white/10'}`}></div><div className="flex items-center gap-2"><Globe size={14} /> STOCKHOLM</div><div className={`h-4 w-px ${theme.id === 'light' ? 'bg-slate-300' : 'bg-white/10'}`}></div><div className={`flex items-center gap-2 ${theme.textDim}`}><Clock size={14} /> {currentTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div></div>
                </header>
                
                {activeTab === 'neural' && <NeuralView theme={theme} username={username} />}
                {activeTab === 'telemetry' && <TelemetryView theme={theme} />}
                {activeTab === 'health' && <HealthView theme={theme} />}
                {activeTab === 'docker' && <DockerView theme={theme} username={username} />}
                {activeTab === 'minecraft' && <MinecraftView theme={theme} />}
                {activeTab === 'streaming' && <StreamingView theme={theme} />}
                {activeTab === 'borealis' && <BorealisView theme={theme} avatar={avatar} />}
                {activeTab === 'storage' && <StorageView theme={theme} />}
                {activeTab === 'settings' && <SettingsView username={username} theme={theme} setTheme={setTheme} avatar={avatar} setAvatar={setAvatar} />}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuroraOS />);
    </script>
</body>
</html>
